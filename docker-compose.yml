services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fitness_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitness_app_password}
      POSTGRES_DB: ${DB_NAME:-fitness_app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: fitness_app_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      # tsx's file watcher misses change events on a Windows bind mount
      # without polling -- without this, edits require a manual
      # `docker compose restart backend` instead of auto-reloading.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-fitness_app}
      DB_PASSWORD: ${DB_PASSWORD:-fitness_app_password}
      DB_NAME: ${DB_NAME:-fitness_app}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8443,http://localhost,https://localhost,capacitor://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-4-5}
      # host.docker.internal lets the container reach Ollama running on the
      # Windows host (Docker Desktop resolves this automatically).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ironvein.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4
    container_name: fitness_app_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
